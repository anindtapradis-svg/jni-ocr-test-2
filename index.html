<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JNI OCR Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4fafa;font-family:Arial,sans-serif;color:#153333}.container{max-width:900px;margin:auto;padding:30px 16px}.header{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;background:#24B1B1;color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold}h1{margin:0;font-size:25px}.muted{color:#718181}.card{background:#fff;padding:20px;margin-top:18px;border-radius:18px;border:1px solid #dceaea}label{display:block;font-weight:bold;margin-bottom:7px}select,input[type=file]{width:100%;padding:12px;border:1px solid #ccd;border-radius:10px;background:#fff}.dropzone{margin-top:15px;padding:30px;border:2px dashed #9fcaca;border-radius:14px;text-align:center;cursor:pointer}button{margin-top:15px;padding:12px 18px;border:0;border-radius:10px;background:#24B1B1;color:#fff;font-weight:bold;cursor:pointer}button.secondary{background:#edf7f7;color:#146565;margin-left:8px}button:disabled{opacity:.6;cursor:not-allowed}.status{margin-top:15px;padding:12px;background:#f1f6f6;border-radius:10px;white-space:pre-wrap}.error{background:#fff0f0;color:#9b2424}.success{background:#edf9f2;color:#17663b}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.field{padding:12px;border:1px solid #e0eaea;border-radius:10px}.field small{display:block;color:#718181;margin-bottom:5px}.field input{width:100%;border:0;outline:0;font-size:15px;padding:0}pre{background:#102020;color:#dffafa;padding:15px;border-radius:10px;overflow:auto;font-size:12px}.hidden{display:none}@media(max-width:650px){.result-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="container">
<div class="header"><div class="logo">JNI</div><div><h1>JNI OCR Test</h1><div class="muted">Pembaca KTP / Paspor / KK</div></div></div>
<div class="card">
<label>Jenis Dokumen</label><select id="documentType"><option value="KTP">KTP</option><option value="PASSPORT">Paspor</option><option value="KK">KK</option><option value="OTHER">Dokumen lain</option></select>
<label style="margin-top:15px">Upload Dokumen</label><input id="fileInput" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf">
<div class="dropzone" id="dropzone"><strong>Tarik file ke sini</strong><br><span class="muted">atau klik untuk memilih file</span></div>
<button id="readButton">🔍 Baca Dokumen</button><button class="secondary" id="resetButton">Reset</button><div id="status" class="status hidden"></div>
</div>
<div class="card hidden" id="resultCard"><h2>Hasil Pembacaan</h2><div id="resultGrid" class="result-grid"></div><h3>Validasi</h3><div id="validation" class="status"></div><details style="margin-top:15px"><summary>JSON hasil OCR</summary><pre id="jsonResult"></pre></details></div>
</div>
<script>
const fileInput=document.getElementById('fileInput'),dropzone=document.getElementById('dropzone'),readButton=document.getElementById('readButton'),resetButton=document.getElementById('resetButton'),statusBox=document.getElementById('status');let selectedFile=null;
fileInput.addEventListener('change',()=>{selectedFile=fileInput.files[0]||null;showFile()});dropzone.addEventListener('click',()=>fileInput.click());dropzone.addEventListener('dragover',e=>{e.preventDefault();dropzone.style.borderColor='#24B1B1'});dropzone.addEventListener('drop',e=>{e.preventDefault();selectedFile=e.dataTransfer.files[0]||null;showFile()});
function showFile(){dropzone.innerHTML=selectedFile?`<strong>${escapeHtml(selectedFile.name)}</strong><br><span class="muted">${(selectedFile.size/1024/1024).toFixed(2)} MB</span>`:'<strong>Tarik file ke sini</strong><br><span class="muted">atau klik untuk memilih file</span>'}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(msg,type=''){statusBox.className='status '+type;statusBox.textContent=msg;statusBox.classList.remove('hidden')}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
readButton.addEventListener('click',async()=>{if(!selectedFile)return status('Pilih dokumen terlebih dahulu.','error');if(selectedFile.size>5*1024*1024)return status('Ukuran file maksimal 5 MB.','error');readButton.disabled=true;readButton.textContent='⏳ Membaca dokumen...';try{status('Mengirim dokumen ke OCR...');const dataUrl=await fileToDataURL(selectedFile);const response=await fetch('/api/ocr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({documentType:document.getElementById('documentType').value,fileName:selectedFile.name,mimeType:selectedFile.type,dataUrl})});const responseText=await response.text();let result;try{result=JSON.parse(responseText)}catch{throw new Error(`Server mengembalikan response bukan JSON.\nHTTP ${response.status}\n\n${responseText.substring(0,800)}`)}if(!response.ok)throw new Error(result.error||'OCR gagal.');displayResult(result);status('Dokumen berhasil dibaca.','success')}catch(e){status(e.message||'Terjadi kesalahan.','error')}finally{readButton.disabled=false;readButton.textContent='🔍 Baca Dokumen'}});
function displayResult(result){const d=result.data||{};const fields=[['Nama','nama'],['NIK','nik'],['No. Paspor','passport_number'],['Tempat Lahir','tempat_lahir'],['Tanggal Lahir','tanggal_lahir'],['Jenis Kelamin','jenis_kelamin'],['Kewarganegaraan','nationality'],['Tanggal Terbit','tanggal_terbit'],['Tanggal Expired','expiry_date'],['Alamat','alamat'],['Nomor KK','kk_number'],['MRZ','mrz']];document.getElementById('resultGrid').innerHTML=fields.filter(f=>d[f[1]]).map(f=>`<div class="field"><small>${f[0]}</small><input readonly value="${escapeHtml(d[f[1]])}"></div>`).join('');const checks=result.validation?.checks||[];document.getElementById('validation').textContent=checks.map(x=>`${x.ok?'✓':'⚠'} ${x.message}`).join('\n')||'Tidak ada hasil validasi.';document.getElementById('jsonResult').textContent=JSON.stringify(result,null,2);document.getElementById('resultCard').classList.remove('hidden')}
resetButton.addEventListener('click',()=>{selectedFile=null;fileInput.value='';document.getElementById('resultCard').classList.add('hidden');statusBox.classList.add('hidden');showFile()});
</script></body></html>
